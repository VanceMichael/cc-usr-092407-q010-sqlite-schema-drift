services:
  scaffold:
    build:
      context: .
      dockerfile: Dockerfile.scaffold
    init: true
    healthcheck:
      test: ["CMD", "sh", "scaffold/validate_inputs.sh"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: airport-disruption-api:local
    init: true
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/disruptions.db
      FIXTURES_DIR: /srv/fixtures
    volumes:
      - disruption-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2); sys.exit(0 if json.load(r)['status']=='ok' else 1)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  disruption-data:
